name: Daily Harvest

on:
  schedule:
    # The National Map publishes through the day; GNIS's files are regenerated overnight, US time
    - cron: "0 13 * * *"
  workflow_dispatch: # Allows manual triggering

jobs:
  harvest:
    runs-on: ubuntu-latest
    # A run takes about 11 minutes, nearly all of it paging through The National Map's catalog
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Run tests
        run: for test in test/*_test.rb; do ruby "$test" || exit 1; done

      - name: Run harvester
        run: ruby harvester.rb

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A metadata-aardvark/
          # The withdrawal log only exists once a package has left the catalog
          if [ -f withdrawn.json ]; then git add withdrawn.json; fi
          git diff --staged --quiet || git commit -m "Auto-update from daily harvest"
          git push
